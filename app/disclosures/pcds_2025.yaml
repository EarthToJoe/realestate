# Property Condition Disclosure Statement, version-pinned (L43; WS2 §PCDS).
# Text: RPL §462(2) as amended by Chapter 353 of 2024 (A9330-A, enacted; read 2026-10-23 at
# https://legislation.nysenate.gov/pdf/bills/2023/A9330A) [PRIMARY]. Effective 2025-07-01; DOS: "IS REQUIRED
# BEGINNING JULY 1, 2025". 56 questions. Wording is the statute's, printed in sentence case instead of capitals.
# The seller completes it; the software never pre-fills an answer (CP-04; RPL §466; LIBOR guidance).
# Answer types: ynun = Yes / No / Unknown / NA; ynu = Yes / No / Unknown (question 27 has no NA);
# text = the seller's own words ("UNKN" allowed); multi = circle all that apply.
# asked_if: a part the form asks only "if yes" / "if municipal" / "if septic or cesspool".
version: "2025-07-01"
title: Property Condition Disclosure Statement
statute: RPL §462(2), as amended by L. 2024 ch. 353 (A9330-A), effective July 1, 2025
source: https://legislation.nysenate.gov/pdf/bills/2023/A9330A
header:
  - >-
    The Property Condition Disclosure Act requires the seller of residential real property to cause this disclosure
    statement or a copy thereof to be delivered to a buyer or buyer's agent prior to the signing by the buyer of a
    binding contract of sale.
  - >-
    Purpose of statement: This is a statement of certain conditions and information concerning the property known
    to the seller. This disclosure statement is not a warranty of any kind by the seller or by any agent
    representing the seller in this transaction. It is not a substitute for any inspections or tests and the buyer
    is encouraged to obtain his or her own independent professional inspections and environmental tests and also is
    encouraged to check public records pertaining to the property.
  - >-
    A knowingly false or incomplete statement by the seller on this form may subject the seller to claims by the
    buyer prior to or after the transfer of title.
  - >-
    "Residential real property" means real property improved by a one to four family dwelling used or occupied, or
    intended to be used or occupied, wholly or partly, as the home or residence of one or more persons, but shall
    not refer to (a) unimproved real property upon which such dwellings are to be constructed or (b) condominium
    units or cooperative apartments or (c) property on a homeowners' association that is not owned in fee simple
    by the seller.
instructions:
  - (a) Answer all questions based upon your actual knowledge.
  - (b) Attach additional pages with your signature if additional space is required.
  - (c) Complete this form yourself.
  - >-
    (d) If some items do not apply to your property, check "NA" (non-applicable). If you do not know the answer
    check "UNKN" (unknown).
seller_statement: >-
  Seller's statement: The seller makes the following representations to the buyer based upon the seller's actual
  knowledge at the time of signing this document. The seller authorizes his or her agent, if any, to provide a copy
  of this statement to a prospective buyer of the residential real property. The following are representations
  made by the seller and are not the representations of the seller's agent.
sections:
  - title: General information
    questions:
      - {n: 1, type: text, text: "How long have you owned the property?"}
      - {n: 2, type: text, text: "How long have you occupied the property?"}
      - n: 3
        type: text
        text: What is the age of the structure or structures?
        note: Note to buyer - If the structure was built before 1978 you are encouraged to investigate for the presence of lead based paint.
      - {n: 4, type: ynun, explain_if: "yes", text: "Does anybody other than yourself have a lease, easement or any other right to use or occupy any part of your property other than those stated in documents available in the public record, such as rights to use a road or path or cut trees or crops?"}
      - {n: 5, type: ynun, explain_if: "yes", text: "Does anybody else claim to own any part of your property?"}
      - {n: 6, type: ynun, explain_if: "yes", text: "Has anyone denied you access to the property or made a formal legal claim challenging your title to the property?"}
      - {n: 7, type: ynun, explain_if: "yes", text: "Are there any features of the property shared in common with adjoining land owners or a homeowners association, such as walls, fences or driveways?"}
      - {n: 8, type: ynun, explain_if: "yes", text: "Are there any electric or gas utility surcharges for line extensions, special assessments or homeowner or other association fees that apply to the property?"}
      - {n: 9, type: ynun, explain_if: "no", text: "Are there certificates of occupancy related to the property?"}
  - title: Environmental
    note_to_seller: >-
      Note to seller - In this section, you will be asked questions regarding petroleum products and hazardous or
      toxic substances that you know to have been spilled, leaked or otherwise been released on the property or from
      the property onto any other property. Petroleum products may include, but are not limited to, gasoline, diesel
      fuel, home heating fuel, and lubricants. Hazardous or toxic substances are products or other material that
      could pose short- or long-term danger to personal health or the environment if they are not properly disposed
      of, applied or stored. These include, but are not limited to, fertilizers, pesticides and insecticides, paint
      including paint thinner, varnish remover and wood preservatives, treated wood, construction materials such as
      asphalt and roofing materials, antifreeze and other automotive products, batteries, cleaning solvents
      including septic tank cleaners, household cleaners, pool chemicals, products containing mercury and lead and
      indoor mold.
    note_to_buyer: >-
      Note to buyer - If contamination of this property from petroleum products and/or hazardous or toxic substances
      is a concern to you, you are urged to consider soil and groundwater testing of this property.
    questions:
      - {n: 10, type: ynun, explain_if: "yes", text: "Is any or all of the property located in a Federal Emergency Management Agency (FEMA) designated floodplain?"}
      - {n: 11, type: ynun, explain_if: "yes", text: "Is any or all of the property located wholly or partially in the special flood hazard area (\"SFHA\"; \"100-year floodplain\") according to the Federal Emergency Management Agency's (FEMA's) current flood insurance rate maps for your area?"}
      - {n: 12, type: ynun, explain_if: "yes", text: "Is any or all of the property located wholly or partially in a moderate risk flood hazard area (\"500-year floodplain\") according to FEMA's current flood insurance rate maps for your area?"}
      - n: 13
        type: ynun
        explain_if: "yes"
        text: Is the property subject to any requirement under federal law to obtain and maintain flood insurance on the property?
        note: >-
          Homes in the special flood hazard area, also known as high risk flood zones, on FEMA's flood insurance rate
          maps with mortgages from federally regulated or insured lenders are required to obtain and maintain flood
          insurance. Even when not required, FEMA encourages homeowners in high risk, moderate risk, and low risk
          flood zones to purchase flood insurance that covers the structure(s) and the personal property within the
          structure(s). Also note that homes in coastal areas may be subject to increased risk of flooding over time
          due to projected sea level rise and increased extreme storms caused by climate change which may not be
          reflected in current flood insurance rate maps.
      - n: 14
        type: ynun
        explain_if: "yes"
        text: "Have you ever received assistance, or are you aware of any previous owners receiving assistance, from the Federal Emergency Management Agency (FEMA), the U.S. Small Business Administration (SBA), or any other federal disaster flood assistance for flood damage to the property?"
        note: >-
          For properties that have received federal disaster assistance, the requirement to obtain flood insurance
          passes down to all future owners. Failure to obtain and maintain flood insurance can result in an
          individual being ineligible for future assistance.
      - n: 15
        type: ynun
        attach_if: "yes"
        attach: a copy of the policy
        text: Is there flood insurance on the property?
        note: >-
          A standard homeowner's insurance policy typically does not cover flood damage. You are encouraged to
          examine your policy to determine whether you are covered.
      - n: 16
        type: ynun
        attach_if: "yes"
        attach: a copy of the certificate
        text: Is there a FEMA elevation certificate available for the property?
        note: >-
          An elevation certificate is a FEMA form, completed by a licensed surveyor or engineer. The form provides
          critical information about the flood risk of the property and is used by flood insurance providers under
          the National Flood Insurance Program (NFIP) to help determine the appropriate flood insurance rating for
          the property. A buyer may be able to use the elevation certificate from a previous owner for their flood
          insurance policy.
      - {n: 17, type: ynun, explain_if: "yes", text: "Have you ever filed a claim for flood damage to the property with any insurance provider, including the National Flood Insurance Program (NFIP)?"}
      - {n: 18, type: ynun, explain_if: "yes", text: "Is any or all of the property located in a designated wetland?"}
      - {n: 19, type: ynun, explain_if: "yes", text: "Is the property located in an agricultural district?"}
      - {n: 20, type: ynun, explain_if: "yes", text: "Was the property ever the site of a landfill?"}
      - n: 21
        type: ynun
        text: Are there or have there ever been fuel storage tanks above or below the ground on the property?
        parts:
          - {key: in_use, type: ynun, asked_if: {q21: ["yes"]}, label: "If yes, are they currently in use?"}
          - {key: locations, type: text, asked_if: {q21: ["yes"]}, label: "Location(s)"}
          - {key: leaking, type: ynun, explain_if: "yes", asked_if: {q21: ["yes"]}, label: "Are they leaking or have they ever leaked?"}
      - {n: 22, type: ynun, explain_if: "yes", explain_label: State location or locations, text: "Is there asbestos in the structure?"}
      - {n: 23, type: ynun, explain_if: "yes", explain_label: State location or locations, text: "Is lead plumbing present?"}
      - {n: 24, type: ynun, attach_if: "yes", attach: a copy of the report, text: "Has a radon test been done?"}
      - {n: 25, type: ynun, explain_if: "yes", explain_label: Describe, text: "Has motor fuel, motor oil, home heating fuel, lubricating oil or any other petroleum product, methane gas, or any hazardous or toxic substance spilled, leaked or otherwise been released on the property or from the property onto any other property?"}
      - {n: 26, type: ynun, attach_if: "yes", attach: report(s), text: "Has the property been tested for the presence of motor fuel, motor oil, home heating fuel, lubricating oil, or any other petroleum product, methane gas, or any hazardous or toxic substance?"}
      - {n: 27, type: ynu, attach_if: "yes", attach: a copy of the report, text: "Has the property been tested for indoor mold?"}
  - title: Structural
    questions:
      - {n: 28, type: ynun, explain_if: "yes", text: "Is there any rot or water damage to the structure or structures?"}
      - {n: 29, type: ynun, explain_if: "yes", text: "Is there any fire or smoke damage to the structure or structures?"}
      - {n: 30, type: ynun, explain_if: "yes", text: "Is there any termite, insect, rodent or pest infestation or damage?"}
      - {n: 31, type: ynun, attach_if: "yes", attach: report(s), text: "Has the property been tested for termite, insect, rodent or pest infestation or damage?"}
      - n: 32
        type: parts
        text: What is the type of roof/roof covering (slate, asphalt, other.)?
        parts:
          - {key: type, type: text, label: "Type of roof/roof covering"}
          - {key: defects, type: text, label: "Any known material defects?"}
          - {key: age, type: text, label: "How old is the roof?"}
          - {key: warranty, type: ynun, explain_if: "yes", label: "Is there a transferable warranty on the roof in effect now?"}
      - {n: 33, type: ynun, explain_if: "yes", text: "Are there any known material defects in any of the following structural systems: footings, beams, girders, lintels, columns or partitions?"}
  - title: Mechanical systems & services
    questions:
      - n: 34
        type: parts
        text: What is the water source (circle all that apply - well, private, municipal, other)?
        parts:
          - {key: source, type: multi, options: [Well, Private, Municipal, Other], label: "Water source"}
          - {key: metered, type: ynun, asked_if: {q34_source: [Municipal]}, label: "If municipal, is it metered?"}
      - {n: 35, type: ynun, explain_if: "yes", explain_label: Describe, text: "Has the water quality and/or flow rate been tested?"}
      - n: 36
        type: parts
        text: What is the type of sewage system (circle all that apply - public sewer, private sewer, septic or cesspool)?
        note: >-
          More information on "septic system operation and maintenance" can be found on the NYS Department of Health
          website in the informational health pamphlet made available by the Department of Health pursuant to
          section 396-s of NYS general business law.
        parts:
          - {key: type, type: multi, options: [Public sewer, Private sewer, Septic, Cesspool], label: "Type of sewage system"}
          - {key: age, type: text, asked_if: {q36_type: [Septic, Cesspool]}, label: "If septic or cesspool, age?"}
          - {key: last_pumped, type: text, asked_if: {q36_type: [Septic, Cesspool]}, label: "Date last pumped?"}
          - {key: frequency, type: text, asked_if: {q36_type: [Septic, Cesspool]}, label: "Frequency of pumping?"}
          - {key: defects, type: ynun, explain_if: "yes", label: "Any known material defects?"}
      - n: 37
        type: parts
        text: Who is your electric service provider?
        parts:
          - {key: provider, type: text, label: "Electric service provider"}
          - {key: amperage, type: text, label: "What is the amperage?"}
          - {key: breakers, type: text, label: "Does it have circuit breakers or fuses?"}
          - {key: poles, type: text, label: "Private or public poles?"}
          - {key: defects, type: ynun, explain_if: "yes", label: "Any known material defects?"}
      - {n: 38, type: ynun, explain_if: "yes", explain_label: State locations and explain, text: "Are there any flooding, drainage or grading problems that resulted in standing water on any portion of the property?"}
      - {n: 39, type: ynun, explain_if: "yes", text: "Has the structure(s) experienced any water penetration or damage due to seepage or a natural flood event, such as from heavy rainfall, coastal storm surge, tidal inundation or river overflow?"}
  - title: Known material defects
    intro: >-
      Are there any known material defects in any of the following (if yes, explain below. Use additional sheets if
      necessary.):
    questions:
      - {n: 40, type: ynun, explain_if: "yes", text: "Plumbing system?"}
      - {n: 41, type: ynun, explain_if: "yes", text: "Security system?"}
      - {n: 42, type: ynun, explain_if: "yes", text: "Carbon monoxide detector?"}
      - {n: 43, type: ynun, explain_if: "yes", text: "Smoke detector?"}
      - {n: 44, type: ynun, explain_if: "yes", text: "Fire sprinkler system?"}
      - {n: 45, type: ynun, explain_if: "yes", text: "Sump pump?"}
      - {n: 46, type: ynun, explain_if: "yes", text: "Foundation/slab?"}
      - {n: 47, type: ynun, explain_if: "yes", text: "Interior walls/ceilings?"}
      - {n: 48, type: ynun, explain_if: "yes", text: "Exterior walls or siding?"}
      - {n: 49, type: ynun, explain_if: "yes", text: "Floors?"}
      - {n: 50, type: ynun, explain_if: "yes", text: "Chimney/fireplace or stove?"}
      - {n: 51, type: ynun, explain_if: "yes", text: "Patio/deck?"}
      - {n: 52, type: ynun, explain_if: "yes", text: "Driveway?"}
      - {n: 53, type: ynun, explain_if: "yes", text: "Air conditioner?"}
      - {n: 54, type: ynun, explain_if: "yes", text: "Heating system?"}
      - {n: 55, type: ynun, explain_if: "yes", text: "Hot water heater?"}
      - n: 56
        type: text
        text: The property is located in the following school district (or UNKN)
        note: >-
          Note: Buyer is encouraged to check public records concerning the property (e.g. tax records and wetland and
          FEMA's current flood insurance rate maps and elevation certificates)
explanation_prompt: >-
  The seller should use this area to further explain any item above. If necessary, attach additional pages and
  indicate here the number of additional pages attached.
seller_certification: >-
  Seller's certification: Seller certifies that the information in this property condition disclosure statement is
  true and complete to the seller's actual knowledge as of the date signed by the seller. If a seller of residential
  real property acquires knowledge which renders materially inaccurate a property condition disclosure statement
  provided previously, the seller shall deliver a revised property condition disclosure statement to the buyer as
  soon as practicable. In no event, however, shall a seller be required to provide a revised property condition
  disclosure statement after the transfer of title from the seller to the buyer or occupancy by the buyer, whichever
  is earlier.
buyer_acknowledgment: >-
  Buyer's acknowledgment: Buyer acknowledges receipt of a copy of this statement and buyer understands that this
  information is a statement of certain conditions and information concerning the property known to the seller. It
  is not a warranty of any kind by the seller or seller's agent and is not a substitute for any home, pest, radon or
  other inspections or testing of the property or inspection of the public records.
