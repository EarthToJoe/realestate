# One entry per step and screen: the step list, the narration cards and docs/DEMO-SCRIPT.md all come from here
# (spec section 8). scripts/gen-demo-script.py writes the script; a test fails if the committed file differs.
# `built: false` steps show a "coming in slice N" screen until their slice lands.
steps:
  - n: 1
    title: Intake
    slice: 1
    built: true
    minutes: 1.5
    screens:
      - route: /intake
        title: Address and facts
        click: Click "Use demo house", then "Start intake".
        say: >-
          The seller types an address and a handful of facts the public record leaves out: parking, condition,
          roof, taxes, and the four state notice questions. The demo house is a real address in Holmes, so every
          screen carries the DEMONSTRATION mark; the seller is a fictional person and no owner name is stored.
        marker: none; the AI sends three notices as soon as the seller submits (CP-24, blue)
      - route: /intake/profile
        title: Property profile
        click: Click "Let the AI fill the gaps".
        say: >-
          Every fact shows where it came from: green is the public record, amber is what the seller told us,
          purple is what the AI inferred, with its reason and confidence. The AI fills only facts about the house,
          never the seller's disclosure answers. The badge says whether this is the AI live or a recorded replay.
        marker: none
      - route: /intake/disclosures
        title: Disclosure checklist
        click: Switch persona to Seller, answer the disclosure questions, click "Submit my answers".
        say: >-
          The AI works out which disclosures this house needs from the facts: lead paint is not required because
          it was built in 1995, and it is not in an agricultural district. The Property Condition Disclosure is
          the seller's own: the software never pre-fills it. That is an amber "Your decision" card: only the seller
          can complete it, and contract signing waits for it.
        marker: CP-04 seller decision (amber, blocks contract signing)
      - route: /intake/onboarding
        title: Seller onboarding
        click: >-
          As Seller, acknowledge the agency form. As Presenter, click "Let the AI accept the listing". As Seller,
          sign the listing agreement. (Try signing before acknowledging: the app refuses and says why.)
        say: >-
          The AI gives the listing presentation, runs a conflicts check and accepts the listing. The red "NY law
          today" marker says what the research found: accepting a listing for a fee is a licensed broker's act.
          It is recorded and counted, and it does not stop the flow. The seller acknowledges the agency form and
          signs the listing agreement, with the state's exclusive-listing explanation printed on it: those are the
          seller's own decisions, and nothing is marketed until the agreement is signed.
        marker: CP-01 and CP-03 seller decisions (amber); CP-02 NY law today (red, licensed broker)
  - n: 2
    title: Pricing
    slice: 2
    built: true
    minutes: 1.5
    screens:
      - route: /pricing
        title: Comparable sales and adjustments
        click: Open "Pricing". Open "Every adjustment, line by line" to show the arithmetic.
        say: >-
          Eight real sales from the county's public sales records, all within about four miles. The code, not the
          model, adjusts each one toward this house: date of sale, size, finished basement, lot, age, rooms, central
          air and style, at the rates printed on the screen. Sales needing large adjustments or far away are flagged
          and weigh less. The label says what this is: a comparative market analysis, not an appraisal.
        marker: none on this screen; the range is computed in code
      - route: /pricing/advice
        title: The AI's advice, net sheet and the seller's price
        click: >-
          Click "Let the AI recommend a price". Switch persona to Seller and click "Choose this list price". (Try
          step 3 first: the copy refuses to start until the seller chooses.)
        say: >-
          The AI explains the method in plain words, names the weaker sales, and recommends a list price with its
          reasoning and the net sheet. The red marker is the research: advising a seller on price is the listing
          agent's fiduciary duty, which New York reserves to a licensed broker. It is recorded and does not stop the
          flow. The price itself is the seller's decision, and the listing copy waits for it.
        marker: CP-25 NY law today (red, licensed broker); CP-05 seller decision (amber, blocks step 3)
  - n: 3
    title: Listing copy
    slice: 2
    built: true
    minutes: 2.0
    screens:
      - route: /copy
        title: Drafts and the fair-housing check
        click: >-
          Click "Let the AI write the copy". On the portal description click "Plant a violation (demo)", then "Let
          the AI apply the fix and re-check", then "Let the AI mark passing copy ready to publish".
        say: >-
          The AI writes the MLS remarks, the portal description, three social posts and the flyer, and every piece
          goes through the fair-housing check: our written rules for every federal and New York protected class and
          for steering, then a model review for coded language. Plant a violation: "perfect for a young family,
          steps from the church". It is caught with the rule, the class, the legal basis and a fixed version. The
          AI applies the fix, the re-check passes, and only then can the AI mark it ready to publish. Marking an ad
          ready is a broker's act in New York: the red marker.
        marker: CP-26 fair-housing pass (blue, per piece); CP-06 NY law today (red, per piece)
      - route: /copy/mls
        title: MLS pre-check and package
        click: Open "MLS pre-check and package"; open the flyer PDF.
        say: >-
          The remarks are checked against OneKey's rules: no contact details or showing instructions, no
          compensation, never "free". The package lists every field in OneKey order with RESO names. The flyer PDF
          carries the DEMONSTRATION mark on every page, because the house is a real address and nobody authorised a
          listing.
        marker: none on this screen
  - n: 4
    title: Marketing plan
    slice: 2
    built: true
    minutes: 1.0
    screens:
      - route: /channels
        title: Channel board
        click: >-
          As Seller, choose "Publish to Internet" and sign. As Presenter, click "Record the MLS entry (simulated)"
          and watch the portal and website cards change.
        say: >-
          Every card says honestly who does the work. OneKey MLS has no listing-input API, so a licensed MLS
          participant keys the listing from the AI's package: the grey "human required" marker, linked to the
          research. Zillow, Realtor.com, Redfin and Homes.com are fed from the MLS, not by us. The firm's own page
          waits for the MLS entry under the Clear Cooperation rule. The seller signs the exposure choice and the
          lockbox and photo authorisations: their decision.
        marker: CP-07 seller decision (amber); CP-08 human required (grey)
  - n: 5
    title: Communications
    slice: 3
    built: true
    minutes: 1.5
    screens:
      - route: /inbox
        title: Fact sheet, authority and shared inbox
        click: >-
          As Seller, approve the fact sheet and the AI's authority (allow self-guided tours). Then click "Let all of
          them arrive" and read the threads; as Seller, answer the two cards under "For the seller to decide".
        say: >-
          Nothing leaves until the seller approves the facts and the AI's authority. Then eight simulated enquiries
          arrive and the AI deals with each on its own: it answers from the approved facts and discloses the oil heat
          and the septic; it books an owner-hosted showing and a self-guided tour; it refuses to rate schools or the
          area and points to official sources; it says it can't give legal advice. Only two things reach the
          seller: a price question and a showing outside the seller's hours. Every message carries the firm's
          identity block, passed the fair-housing check, and the first one on each thread carries the agency form.
          Each one that discusses the listing records a red CP-09 marker: in New York today that is a licensed act.
        marker: CP-27 seller decision (amber); CP-09 and CP-28 NY law today (red); CP-10 human required (grey); CP-24 and CP-29 AI did it (blue)
  # Walk order: step 8 (the buyer's side) is walked before step 6, because offer B in step 6 comes from the firm's
  # own buyer. The step list on screen stays in number order (decision 34).
  - n: 8
    title: Buyer side
    slice: 3
    built: true
    minutes: 2.0
    screens:
      - route: /buyer
        title: Buyer intake and representation
        click: >-
          Click "Use the demo buyer (fictional)", then "Become a client of the firm". As Buyer, acknowledge the
          agency form and sign the buyer agreement.
        say: >-
          The same system from the buyer's side. The intake asks about the home and the money only, never about
          family, religion or any protected trait. The AI takes the buyer on as a client, a broker's act in New York
          today (red CP-30), sends the agency form, the fair-housing notice and the "not legal services" notice, and
          the buyer agreement with a stated, negotiable fee. The buyer's private limit goes to the buyer's AI only:
          the seller's AI never sees it.
        marker: CP-30 NY law today (red); CP-24 AI did it (blue); CP-16 buyer decision (amber)
      - route: /buyer/search
        title: Search and alerts
        click: Click "Save the search and let the AI send the alert".
        say: >-
          Fictional listings and this firm's own listing. The filters are the home's facts only: there is no
          school-rating or neighbourhood filter, so the search cannot steer. The buyer's AI writes the alert; it is
          fair-housing checked and carries the firm's identity block, like every message.
        marker: CP-09 NY law today (red); CP-24 AI did it (blue)
      - route: /buyer/tour
        title: Tour request and dual-agency consent
        click: >-
          Click "Ask the AI to book a tour". As Buyer, then as Seller, consent to dual agency.
        say: >-
          The code refuses a tour before the buyer agreement is signed. The seller's AI books it inside the
          seller's hours: self-guided, a red marker because New York has not decided whether an unaccompanied tour
          is a licensed showing. Because the firm also acts for the seller, both clients consent in writing to dual
          agency before the buyer can make an offer: each keeps its own AI and its own secrets.
        marker: CP-29 AI did it (blue); CP-28 NY law today (red); CP-17 seller and buyer decision (amber)
      - route: /buyer/offer
        title: Offer advice, draft and approval
        click: >-
          Click "Let the buyer's AI advise and draft the offer". As Buyer, approve and send it. Later, after the
          seller's counter in step 6, come back: "Let the buyer's AI advise on the counter", and as Buyer approve the
          reply.
        say: >-
          The buyer's AI advises on price and terms from the buyer's own answers, the public sales and the house's
          facts, and drafts the offer: a broker's act today (red CP-31). Only the buyer can approve it; then it goes
          to the seller's side as offer B. When the seller counters, the buyer's AI advises again, the buyer approves
          the reply, and the buyer's AI sends exactly that: negotiating for the buyer, a red CP-13.
        marker: CP-31 and CP-13 NY law today (red); CP-18 buyer decision (amber)
  - n: 6
    title: Offers
    slice: 3
    built: true
    minutes: 1.5
    screens:
      - route: /offers
        title: Offer comparison, advice, decision and negotiation
        click: >-
          Click "Let the AI present the offers and advise". As Seller, counter offer B at the suggested figures
          (price, the lowest price the AI may agree, closing date and periods). Click "Let the AI send the seller's
          counter". As Presenter, try a counter by hand below the seller's lowest price and watch it refused. Then go
          to step 8's offer screen for the buyer's reply, and come back: the seller's AI has answered on its own.
        say: >-
          Two written offers: one from an outside buyer's agent, one from the firm's own buyer. Code builds the
          comparison and each net sheet; the seller's AI presents every offer and advises, a licensed act in New York
          today (red CP-11). The seller decides: accept, counter or reject, and the limits of the counter: price,
          closing date, inspection and mortgage periods, requests. The seller's AI negotiates with the buyer's AI on
          its own, each act a red CP-13. Anything outside the seller's decision is refused by code and goes back to
          the seller. Nothing is binding until both sign a contract.
        marker: CP-11 and CP-13 NY law today (red); CP-12 seller decision (amber)
  - n: 7
    title: Contract
    slice: 3
    built: true
    minutes: 2.0
    screens:
      - route: /contract
        title: Memorandum, contract draft, side-by-side, signing
        click: >-
          Click "Let the AI draft the contract and rider". Read the red CP-14 marker. Click "Open the contract for
          signing" and watch it refused: the seller's disclosure statement is missing. Open the form (next screen),
          then come back, attach the disclosures, open signing, and sign as Seller and as Buyer. Open the PDF and the
          DOCX.
        say: >-
          The memorandum goes to both parties. The AI drafts the contract of sale and rider for both of them, in the
          bar-association long form's order, with a side-by-side note for each of its 28 paragraphs. Code checks the
          draft against the deal and refuses any wording that says a lawyer is unnecessary. The red marker says it
          plainly: in New York today only a lawyer may draft a contract of sale for another; at launch the lawful
          route is the firm's paper subject to each party's attorney's approval. Signing waits for the seller's own
          disclosure statement. The signing map shows what e-signature cannot do: the deed's notary, a power of
          attorney's witnesses, the smoke-detector affidavit. Every page of the PDF and the DOCX carries the label.
        marker: CP-32 AI did it (blue); CP-14 NY law today (red); CP-15 human required (grey); CP-33 seller and buyer decision (amber)
      - route: /disclosures/pcds
        title: The seller's Property Condition Disclosure Statement
        click: >-
          As Seller, click "Seller: submit my prepared answers" (or answer the 56 questions by hand). Then back to
          the contract.
        say: >-
          The full current form, 56 questions, effective July 2025. Every field starts blank: the seller completes
          it from their own knowledge, and the software never fills it in. The demo seller's answers are fiction,
          labelled as such.
        marker: CP-04 seller decision (amber)
  - n: 9
    title: Deal timeline
    slice: 1
    built: true
    minutes: 1.0
    screens:
      - route: /timeline
        title: Deal timeline and hurdle map
        click: Open "Deal timeline" in the step list.
        say: >-
          This page is built only from the records the other screens wrote; nothing is drawn by hand. Blue is
          what the AI did, amber what the seller or buyer decided, red where New York law today requires a
          licensed broker or a lawyer, grey the people and third parties outside the software. The red marker at
          the top stands for the whole firm: New York requires a licensed broker of record, and this demonstration
          has none. The hurdle map below lists every red marker with its rule and a link to the research.
        marker: every record so far; CP-35 standing; CP-20 to CP-23 and CP-34 planned
  - n: 10
    title: Marketing the business
    slice: 4
    built: false
    minutes: 0.5
    screens:
      - route: /step/10
        title: Marketing the business
        click: (slice 4)
        say: Coming in slice 4.
        marker: CP-26 automated; CP-19 NY law today
